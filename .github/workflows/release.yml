name: Release PocketPlan for Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      POCKETPLAN_ANDROID_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Set temporary signing key path
        run: echo "POCKETPLAN_ANDROID_KEYSTORE=$RUNNER_TEMP/pocketplan-release.jks" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Validate version and restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version.');
          const tag = `v${version}`;
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== tag) throw new Error('Tag must match application version.');
          if (!process.env.ANDROID_KEYSTORE_BASE64 || !process.env.POCKETPLAN_ANDROID_PASSWORD) throw new Error('Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets before releasing.');
          fs.writeFileSync(process.env.POCKETPLAN_ANDROID_KEYSTORE, Buffer.from(process.env.ANDROID_KEYSTORE_BASE64, 'base64'), {mode: 0o600});
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TAG=${tag}\n`);
          NODE
      - name: Verify signing key access
        run: keytool -certreq -alias pocketplan -storetype PKCS12 -keystore "$POCKETPLAN_ANDROID_KEYSTORE" -storepass:env POCKETPLAN_ANDROID_PASSWORD -keypass:env POCKETPLAN_ANDROID_PASSWORD -file "$RUNNER_TEMP/pocketplan-key-check.csr"
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
      - name: Install build tools
        run: |
          npm ci
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Test financial engines and adapters
        run: |
          cargo test --manifest-path crates/pocketplan-core/Cargo.toml --locked
          cargo build --manifest-path crates/pocketplan-core/Cargo.toml --locked
          node --test scripts/*.test.mjs
      - name: Initialize Android project
        run: |
          npm run tauri -- android init --ci --skip-targets-install
          node scripts/prepare-android.mjs
      - name: Build signed Android APK
        run: npm run tauri -- android build --ci --apk --target aarch64 -- --locked
      - name: Verify signature and package APK
        run: node scripts/package-android.mjs
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.apk artifacts/SHA256SUMS-android.txt --target "$GITHUB_SHA" --title "PocketPlan $RELEASE_TAG for Android" --notes-file .github/RELEASE_NOTES.md
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$POCKETPLAN_ANDROID_KEYSTORE"
