name: Release PocketPlan for Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate release version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Git tag must match the application version.' }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - name: Install dependencies and Rust
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup update stable --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: Test financial engines and adapters
        run: |
          cargo test --manifest-path crates/pocketplan-core/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path crates/pocketplan-core/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/*.test.mjs
      - name: Build Windows application
        run: npm run tauri -- build --no-bundle --ci -- --locked
      - name: Package application and checksum
        run: ./scripts/package-release.ps1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = Get-ChildItem artifacts -File | ForEach-Object FullName
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title "PocketPlan $env:RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md
