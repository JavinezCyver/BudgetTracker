[package]
name = "pocketplan-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "pocketplan-engine"
path = "src/bin/engine.rs"
